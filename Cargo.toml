[package]
name = "euterpe-press"
version = "0.2.0"
edition = "2024"
description = "Turns a background video into one euterpe-org.com will accept"
license = "GPL-3.0-or-later"
publish = false

# Size over speed, deliberately: this ships as ONE file that a charter
# downloads, and the only CPU-bound work Press does itself is walking an MP4's
# box tree — everything expensive happens inside the encoder it carries.
#
# Unwinding stays ON. `panic = "abort"` would shave the binary, but a tool that
# vanishes without a word is worse than a larger one: a panic has to remain
# catchable so it can be shown. Same reasoning as Euterpe.Doctor's profile.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
rfd = "0.17.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
winresource = "0.1.31"
